[project]
name = "stoff-types"
version = "0.1.0"
authors = [
    { name = "Felix", email = "felixpaetsch@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0.2",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # Pyflakes
  # "I",    # import sorting
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # simplify
  "ANN",  # missing annotations
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.9"
root = ["."]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]


[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
